<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--line:#e3e8f0;--ink:#1a2233;--mut:#8b95a7;--navy:#0f1730;--blue:#2563eb;--green:#16c254;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#dde2ea;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
svg{width:24px;height:24px;flex:none}
#app{max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}

/* header */
.top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:flex;align-items:center;background:#e8ecf3;border-radius:999px;padding:5px 12px 5px 8px;font-weight:800;font-size:15px;color:#333b4d}
.pill svg{width:26px;height:26px}
.pill span{flex:1;text-align:center}
.row2{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:8px}
.sqs{display:flex;gap:8px}
.sq{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;padding:0;box-shadow:0 2px 0 #e3e8f0}
.sq svg{width:26px;height:26px}
.income{text-align:center;line-height:1}
.income small{display:block;font-size:11px;font-weight:700;color:#7b879c}
.income b{display:block;font-size:28px;font-weight:900;color:#15b94d;margin:2px 0 3px;letter-spacing:-.5px}
.dem{white-space:nowrap;border:0;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:800;color:#fff;background:#6b7690;box-shadow:0 2px 0 #4b5568}
.dem.hot{background:#f97316;box-shadow:0 2px 0 #c2570c}
.dem.cold{background:#3b82f6;box-shadow:0 2px 0 #2459b5}
.sportbtn{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:14px;padding:9px 14px 9px 10px;font-weight:800;font-size:14px;letter-spacing:.02em;box-shadow:0 3px 0 #05091a}
.sportbtn svg{width:24px;height:24px}

/* match */
.match{margin:0 12px;border-radius:18px;background:var(--navy);overflow:hidden;border:3px solid var(--navy);box-shadow:0 6px 16px rgba(15,23,48,.25);flex:none}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;color:#fff;gap:6px}
.mhead small{display:block;font-size:9.5px;letter-spacing:.06em;color:#aab4cc;font-weight:700;white-space:nowrap}
.mhead b{font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px;line-height:1.15}
.mhead .r{text-align:right}.mhead .r b{justify-content:flex-end}
.mhead .r svg{width:18px;height:18px;color:#8fa0c8}
.wd{width:12px;height:12px;border-radius:50%;background:#22c55e;display:inline-block}
.score{display:flex;gap:8px;align-items:center;border:1px solid #2a3558;background:#162044;border-radius:12px;padding:5px 10px;font-weight:800;font-size:17px;justify-content:space-between}
.score .m{color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;text-align:center}
.us{color:#4f8bff}.op{color:#ff4d5e}
#cv{display:block;width:100%;height:auto;aspect-ratio:440/290;background:#fdc85c}

/* content */
main{flex:1;overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sl{flex:1;min-width:0}
.sl b{display:block;font-size:14px;font-weight:800}
.sl span{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:4px}
.bar{height:6px;border-radius:99px;background:#e3e8f0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);border-radius:99px}
.chips{display:flex;gap:4px;background:#e8ecf3;border-radius:10px;padding:3px}
.chip{border:0;background:transparent;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800;color:#6b7690}
.chip.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:relative}
.ct{display:flex;gap:8px;align-items:flex-start;min-height:66px}
.ico{width:44px;height:44px;border-radius:12px;background:#f1f4f8;display:grid;place-items:center;flex:none}
.cn{flex:1;min-width:0}
.cname{font-weight:800;font-size:13.5px;line-height:1.15;padding-right:2px}
.lvl{display:inline-block;margin-top:4px;background:#eef1f6;color:#7b879c;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.i{width:22px;height:22px;border-radius:50%;border:0;background:#8b95a7;color:#fff;display:grid;place-items:center;padding:0;flex:none}
.i svg{width:14px;height:14px}
.val{background:#f1f4f8;border-radius:8px;padding:6px 4px;text-align:center;font-weight:700;font-size:14px;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:6px;color:#3a4357}
.val svg{width:14px;height:14px;color:#6b7690}
.val em{font-style:normal;color:#16a34a;font-weight:800}
.btn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:0;border-radius:10px;padding:9px 10px;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(#3b82f6,#2563eb);box-shadow:0 3px 0 #1d4ed8;transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4ed8}
.btn .p{background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.btn.dis{opacity:.5}
.btn.gold{background:linear-gradient(#fbbf24,#f59e0b);box-shadow:0 3px 0 #b45309}
.btn.green{background:linear-gradient(#22c55e,#16a34a);box-shadow:0 3px 0 #15803d}
.btn.purple{background:linear-gradient(#8b5cf6,#7c3aed);box-shadow:0 3px 0 #5b21b6}
.btn.grey{background:#aab3c4;box-shadow:0 3px 0 #8a94a8}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.sched{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.sched b{display:block;font-size:14px;font-weight:800}
.sched>div>span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.sched .two{display:flex;gap:8px;margin-top:10px}
.sched .slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sched .slots .btn{justify-content:center}
.sched.lockb{display:flex;align-items:center;gap:10px;background:#fff4e5;border-color:#fcd9a8}
.sched.lockb svg{color:#ea580c;width:26px;height:26px}
.locked .btn{opacity:.4}
.note{font-size:12.5px;color:#5b667c;font-weight:600;margin:0 2px 10px;line-height:1.4}
.note b{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.row .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px;font-weight:800}
.row .tx span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:1px}
.row.lock{opacity:.9}
.h2{font-size:13px;font-weight:800;color:#5b667c;text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:11px;color:var(--mut);font-weight:700}

/* nav */
nav{display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));flex:none}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:800;color:#98a2b5;position:relative;padding:3px 0}
nav button svg{width:30px;height:30px}
nav button.on{color:var(--blue)}
.nd{position:absolute;top:1px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.sq .nd{top:-3px;left:auto;right:-3px}
[hidden]{display:none!important}

/* overlays */
#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);background:rgba(15,23,48,.94);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:12px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#ov{position:absolute;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
#ov.show{display:flex}
.sheet{background:#fff;border-radius:22px;padding:18px;width:100%;max-height:86%;overflow-y:auto}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:900}
.sheet .sub{font-size:13px;color:var(--mut);font-weight:600;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.opt.sel{border-color:var(--blue);background:#f0f6ff}
.opt .big{width:54px;height:54px;border-radius:16px;background:var(--navy);display:grid;place-items:center;flex:none}
.opt .big svg{width:32px;height:32px}
.opt b{display:block;font-size:16px;font-weight:900}
.opt span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.opt .tag{margin-left:auto;font-size:11px;font-weight:800;color:#fff;background:var(--blue);padding:3px 9px;border-radius:8px}
input.nm{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:700 16px Inter,sans-serif;margin-bottom:12px;outline:none}
input.nm:focus{border-color:var(--blue)}
.close{margin-top:6px;width:100%;border:0;background:#eef1f6;color:#4b566b;font-weight:800;font-size:14px;padding:12px;border-radius:12px}
.bigmoney{font-size:34px;font-weight:900;color:#15b94d;text-align:center;margin:6px 0 14px}
.calh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.calh b{font-size:16px;font-weight:900}
.calh button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:#4b566b;padding:0}
.calh button:disabled{opacity:.3}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .w{font-size:11px;font-weight:800;color:var(--mut);text-align:center;padding:4px 0}
.calg button,.calg i{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:transparent;font-weight:700;font-size:14px;color:#c3cad7;position:relative;padding:0;display:grid;place-items:center;font-style:normal}
.calg button.ev{background:#eaf1ff;color:#1d4ed8;border-color:#c7dafd}
.calg button.ev::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#2563eb}
.calg button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.calg button.sel::after{background:#fff}
.calg button.done{background:#e8f8ee;color:#16a34a;border-color:#bfe9cd}
.calg button.done::after{background:#16a34a}
.calg button.today{box-shadow:0 0 0 2px #fbbf24}
.calinfo{margin:12px 0 10px;text-align:center;font-size:13px;font-weight:700;color:#4b566b;min-height:18px}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:10px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* ===== tampilan baru (skala 1080px) ===== */
#app{container-type:inline-size;--u:calc(100cqw/1080)}
.top{flex:none;padding:calc(env(safe-area-inset-top,0px) + calc(55*var(--u))) calc(25*var(--u)) calc(18*var(--u));background:#e2e7f0;border-bottom:calc(3*var(--u)) solid #d3dae6}
.pills{display:grid;grid-template-columns:calc(325*var(--u)) 1fr calc(325*var(--u));grid-template-rows:calc(70*var(--u)) calc(100*var(--u));row-gap:calc(24*var(--u));align-items:center}
.pill{grid-column:1;grid-row:1;height:calc(70*var(--u));border:calc(3*var(--u)) solid #d3d9e5;background:#fff;padding:0 calc(18*var(--u)) 0 calc(16*var(--u));border-radius:999px}
.pill svg{width:calc(56*var(--u));height:calc(56*var(--u))}
.pill span{font-size:calc(36*var(--u));font-weight:700}
.pill:nth-of-type(3){grid-column:3}
.income{grid-column:2;grid-row:1/3;align-self:start;display:flex;flex-direction:column;align-items:center}
.income small{font-size:calc(28*var(--u));line-height:calc(34*var(--u));color:#5d6679}
.income b{font-size:calc(64*var(--u));line-height:calc(70*var(--u));margin:0}
.dem{margin-top:calc(6*var(--u));padding:calc(5*var(--u)) calc(22*var(--u));font-size:calc(24*var(--u));border-radius:calc(12*var(--u));box-shadow:0 calc(4*var(--u)) 0 #4b5568}.dem.hot{box-shadow:0 calc(4*var(--u)) 0 #c2570c}.dem.cold{box-shadow:0 calc(4*var(--u)) 0 #2459b5}
.sqs{grid-column:1;grid-row:2;display:flex;gap:calc(42*var(--u));margin-left:calc(45*var(--u))}
.sq{width:calc(98*var(--u));height:calc(98*var(--u));border-radius:calc(24*var(--u));border:calc(3*var(--u)) solid #d3dae6;box-shadow:none}
.sq svg{width:calc(60*var(--u));height:calc(60*var(--u))}
#btnProfile{border:calc(4*var(--u)) solid #4b5568}
.sportbtn{grid-column:3;grid-row:2;justify-self:end;margin-right:calc(23*var(--u));width:calc(282*var(--u));height:calc(103*var(--u));padding:0;justify-content:center;gap:calc(16*var(--u));border-radius:calc(24*var(--u));background:#182236;font-size:calc(40*var(--u));font-weight:700;letter-spacing:0;box-shadow:none}
.sportbtn svg{width:calc(58*var(--u));height:calc(58*var(--u))}
.match{margin:calc(30*var(--u)) calc(25*var(--u)) 0;border-radius:calc(42*var(--u));border:0;background:#0e1630;padding:0}
.mhead{display:grid;grid-template-columns:1fr calc(360*var(--u)) 1fr;height:calc(140*var(--u));padding:0;gap:0;align-items:center}
.mhead>.tl,.mhead>.r{text-align:center;min-width:0;padding:0 calc(8*var(--u))}
.mhead small{font-size:calc(30*var(--u));line-height:calc(36*var(--u));font-weight:800;letter-spacing:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lblL{color:#3b82f6}#lblR{color:#ef4444}
.mhead b,.mhead .r b{justify-content:center;font-size:calc(42*var(--u));line-height:calc(52*var(--u));font-weight:600;gap:calc(12*var(--u));color:#fff}
.mhead b svg,.mhead .r svg{width:calc(40*var(--u));height:calc(40*var(--u))}
.mhead .tl svg{color:#3b82f6}.mhead .r svg{color:#ef4444}
.score{width:calc(360*var(--u));height:calc(110*var(--u));min-width:0;padding:0 calc(40*var(--u));border:calc(3*var(--u)) solid #323f5e;border-radius:calc(30*var(--u));background:#121b36;font-size:calc(48*var(--u));gap:0;justify-content:space-between}
.score .m{font:700 calc(48*var(--u)) ui-monospace,'SF Mono',Menlo,Consolas,monospace;min-width:0}
#cv{display:block;margin:0 calc(8*var(--u)) calc(10*var(--u));width:calc(100% - calc(16*var(--u)));aspect-ratio:440/299;border-radius:0 0 calc(34*var(--u)) calc(34*var(--u))}
#schedZone{flex:none;height:calc(160*var(--u));padding:calc(14*var(--u)) calc(25*var(--u));display:flex;align-items:center}
#schedZone:empty{display:none}
#schedZone .sched{margin:0;width:100%;height:calc(132*var(--u));padding:0 calc(20*var(--u));border-radius:calc(30*var(--u));border:calc(3*var(--u)) solid #e1e6ee;display:flex;align-items:center;gap:calc(16*var(--u))}
#schedZone .sched.lockb{background:#fff4e5;border-color:#fcd9a8}
#schedZone .sched>div:first-of-type{flex:1;min-width:0}
#schedZone .sched b{font-size:calc(30*var(--u));line-height:1.2}
#schedZone .sched span{font-size:calc(24*var(--u));margin-top:calc(2*var(--u))}
#schedZone .two{display:flex;gap:calc(12*var(--u));margin:0;flex:none}
#schedZone .btn{width:auto;flex:none;height:calc(76*var(--u));padding:0 calc(24*var(--u));font-size:calc(28*var(--u));border-radius:calc(20*var(--u));justify-content:center;box-shadow:0 calc(4*var(--u)) 0 rgba(0,0,0,.2)}
main{flex:1;min-height:0;margin:0 calc(25*var(--u));padding:calc(30*var(--u)) 0 calc(20*var(--u));border-top:calc(3*var(--u)) solid #d3dae6}
.strip{margin-bottom:calc(24*var(--u));gap:calc(20*var(--u))}
.sl b{font-size:calc(30*var(--u))}.sl span{font-size:calc(23*var(--u));margin-bottom:calc(6*var(--u))}
.chips{padding:calc(5*var(--u));border-radius:calc(18*var(--u))}.chip{font-size:calc(26*var(--u));padding:calc(10*var(--u)) calc(18*var(--u));border-radius:calc(14*var(--u))}
.grid{gap:calc(32*var(--u)) calc(26*var(--u))}
.card{display:flex;flex-direction:column;border:calc(3*var(--u)) solid #e1e6ee;border-radius:calc(40*var(--u));padding:calc(20*var(--u))}
.card .ct{min-height:0;gap:calc(20*var(--u));padding:0 calc(12*var(--u))}
.card .ico{width:calc(93*var(--u));height:calc(93*var(--u));border-radius:calc(24*var(--u))}
.card .ico svg{width:calc(52*var(--u));height:calc(52*var(--u))}
.card .cname{font-size:calc(34*var(--u));line-height:1.1;font-weight:700}
.card .lvl{font-size:calc(27*var(--u));padding:calc(4*var(--u)) calc(18*var(--u));border-radius:calc(10*var(--u));margin-top:calc(12*var(--u))}
.card .i{width:calc(38*var(--u));height:calc(38*var(--u))}.card .i svg{width:calc(24*var(--u));height:calc(24*var(--u))}
.card .val{margin:calc(24*var(--u)) calc(12*var(--u)) calc(25*var(--u));height:calc(69*var(--u));padding:0;font-size:calc(32*var(--u));font-weight:600;border:calc(2*var(--u)) solid #e1e6ee;border-radius:calc(12*var(--u));gap:calc(14*var(--u))}
.card .val svg{width:calc(30*var(--u));height:calc(30*var(--u))}
.card .val em{color:#1ec45c}
.card .btn{margin-top:auto;height:calc(82*var(--u));padding:0 calc(18*var(--u)) 0 0;border-radius:calc(22*var(--u));font-size:calc(38*var(--u));font-weight:700;box-shadow:0 calc(6*var(--u)) 0 #1d4ed8}
.card .btn .bl{flex:1;text-align:center}
.card .btn .p{width:calc(168*var(--u));height:calc(46*var(--u));display:grid;place-items:center;padding:0;border-radius:calc(12*var(--u));font-size:calc(28*var(--u))}
.card .btn.dis{opacity:1;background:#cfd3da;color:#a8aeb9;box-shadow:0 calc(6*var(--u)) 0 #b5bac4}
.card .btn.dis .p{background:#b9bec8;color:#a2a9b5}
nav{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;height:calc(215*var(--u) + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);background:#f1f4f9;border-top:calc(3*var(--u)) solid #d3dae6}
nav button{font-size:0;gap:0;height:calc(130*var(--u));padding:0;display:grid;place-items:center;color:#9eacc6;isolation:isolate}
nav button svg{width:calc(100*var(--u));height:calc(100*var(--u))}
nav button.on{color:#ea7a2f}
nav button.on::before{content:"";position:absolute;inset:0 calc(20*var(--u));border-radius:calc(30*var(--u));background:#e6ecf8;box-shadow:0 calc(8*var(--u)) 0 #d3dbea;z-index:-1}
#toast{bottom:calc(240*var(--u))}

/* ===== POLISH: desain & animasi ===== */
:root{--sh:0 1px 2px rgba(15,23,48,.06),0 6px 18px rgba(15,23,48,.07);--spring:cubic-bezier(.34,1.56,.64,1)}
html,body{background:radial-gradient(120% 80% at 50% 0,#e8eefc,#d5dbe8)}
#app{background:linear-gradient(180deg,#f7f9fd,#eef1f8 40%,#e9edf5)}
.top{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));backdrop-filter:blur(8px)}
.pill{background:linear-gradient(#f4f6fb,#e4e9f2);box-shadow:inset 0 1px 0 #fff,0 2px 0 #d5dce9;transition:transform .2s var(--spring)}
.pill:active{transform:scale(.96)}
.income b{background:linear-gradient(#22d65f,#0e9f3f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sq,.sportbtn{transition:transform .18s var(--spring),box-shadow .18s}
.sq:active,.sportbtn:active{transform:translateY(2px) scale(.94);box-shadow:none}
.match{background:linear-gradient(160deg,#18234a,#0b1128);box-shadow:0 12px 28px rgba(15,23,48,.35)}
.card{box-shadow:var(--sh);transition:transform .22s var(--spring),box-shadow .22s,border-color .2s}
.card:active{transform:scale(.975)}
.ico{background:linear-gradient(145deg,#f7f9fc,#e6ebf3);box-shadow:inset 0 1px 0 #fff}
.btn{position:relative;overflow:hidden;border-radius:12px}
.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{transition:width .7s cubic-bezier(.22,1,.36,1);background-size:200% 100%;animation:flow 3s linear infinite}
.chip{transition:background .2s,color .2s,transform .18s var(--spring)}
.chip.on{transform:scale(1.05)}
.sheet{box-shadow:0 20px 60px rgba(0,0,0,.3)}
#ov.show{animation:fade .22s ease}
#ov.show .sheet{animation:pop .38s var(--spring)}
#toast{background:linear-gradient(135deg,#1b2548,#0b1128);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .3s,transform .45s var(--spring)}
nav{box-shadow:0 -6px 20px rgba(15,23,48,.08)}
nav button svg{transition:transform .35s var(--spring),color .2s}
nav button.on svg{animation:hop .5s var(--spring);transform:translateY(-2px) scale(1.08)}
nav button:active svg{transform:scale(.88)}
.nd{animation:ping 1.6s ease-out infinite}
#view.tabin>*{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
#view.tabin>*:nth-child(2){animation-delay:.05s}#view.tabin>*:nth-child(3){animation-delay:.1s}#view.tabin>*:nth-child(4){animation-delay:.15s}#view.tabin>*:nth-child(n+5){animation-delay:.2s}
#view.tabin .grid>*{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
#view.tabin .grid>*:nth-child(2){animation-delay:.06s}#view.tabin .grid>*:nth-child(3){animation-delay:.12s}#view.tabin .grid>*:nth-child(4){animation-delay:.18s}#view.tabin .grid>*:nth-child(n+5){animation-delay:.24s}
#mg{background:linear-gradient(180deg,#f7f9fd,#e9edf5);animation:fade .3s ease}
#mg .mgc{box-shadow:var(--sh);animation:rise .5s cubic-bezier(.22,1,.36,1) both}
#mg .mgc:nth-child(2){animation-delay:.06s}#mg .mgc:nth-child(3){animation-delay:.12s}#mg .mgc:nth-child(4){animation-delay:.18s}#mg .mgc:nth-child(5){animation-delay:.24s}#mg .mgc:nth-child(6){animation-delay:.3s}
#mg .mgh h2{background:linear-gradient(90deg,#0f1730,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.mgc:has(.mgt .stars){border-left:4px solid #f59e0b}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.chip .rip,.opt .rip{background:rgba(37,99,235,.2)}
.opt{position:relative;overflow:hidden;transition:transform .2s var(--spring),border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes hop{0%{transform:translateY(4px) scale(.8)}60%{transform:translateY(-6px) scale(1.15)}100%{transform:translateY(-2px) scale(1.08)}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
.gc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.gc.act{border-color:#2563eb;box-shadow:0 0 0 2px #bfd4ff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function pstar(sid,i){return (SPORTS[sid].players[i]&&SPORTS[sid].players[i].s)||1}

function injOf(sid,i){var j=state.sports[sid].inj;return (j&&j[i])||0}
function pfMul(sid,i){return (.4+.6*pfOf(sid,i)/100)*(injOf(sid,i)?.5:1)}

function stageOf(sid,i){var a=pfAge(sid,i);return a<YOUNG?['Muda','#16a34a']:a>=VET?['Veteran','#ea580c']:['Prima','#2563eb']}
